<!DOCTYPE html>
<html>

<head>
  <title>EcoShop</title>
  <style>
    /* Estilos con poco contraste y sin manejo de foco */
    body {
      background: #fdfdfd;
      color: #a0a0a0;
      font-family: Arial, sans-serif;
    }

    /* Encabezado sin contraste adecuado */
    .header {
      background: #a3e635;
      padding: 15px;
      color: #ffffff;
    }

    .header a {
      color: #ffffff;
      text-decoration: none;
      margin-right: 15px;
    }

    /* Botones y tarjetas */
    .product-box {
      border: 1px solid #ddd;
      padding: 15px;
      width: 220px;
      float: left;
      margin: 10px;
    }

    .price-tag {
      color: #ccc;
      font-weight: bold;
    }

    .btn-buy {
      background: #facc15;
      color: #ffffff;
      padding: 8px;
      border: none;
      cursor: pointer;
    }

    /* Ventana modal promocional sin accesibilidad */
    .modal-overlay {
      background: rgba(0, 0, 0, 0.5);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 5px;
      color: #333;
    }

    .close-btn {
      float: right;
      cursor: pointer;
      font-weight: bold;
    }

    /* Redes sociales */
    .social-icon {
      display: inline-block;
      width: 30px;
      height: 30px;
      background: #888;
      color: #fff;
      text-align: center;
      border-radius: 50%;
    }

    .error-msg {
      color: #f87171;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <!-- FALLO 1: Sin enlace de salto (skip-link) -->
  <!-- FALLO 2: Encabezado maquetado con <div> en vez de <header> -->
  <div class="header">
    <!-- FALLO 3: Imagen del logo sin texto alternativo alt -->
    <img
      src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='40'><rect width='100%' height='100%' fill='%23a3e635'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='16' fill='%23fff'>EcoShop</text></svg>">

    <!-- FALLO 4: Menú de navegación sin etiqueta <nav> ni estructura de lista -->
    <div style="float: right;">
      <a href="#">Inicio</a>
      <a href="#">Tienda</a>
      <a href="#">Nosotros</a>
      <a href="#">Contacto</a>
    </div>
  </div>

  <!-- FALLO 5: Falta de jerarquía de encabezados (sin <h1>) -->
  <div style="clear: both; padding: 20px;">
    <h2>Productos Ecológicos</h2>

    <!-- FALLO 6: Uso de <div> genérico para las tarjetas de producto -->
    <div class="product-box">
      <!-- FALLO 7: Atributo alt genérico que no aporta información -->
      <img
        src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='120'><rect width='100%' height='100%' fill='%23eee'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23999'>Foto</text></svg>"
        alt="producto">
      <h3>Botella Reutilizable</h3>
      <!-- FALLO 8: Contraste insuficiente en el precio (#ccc sobre #fff) -->
      <p class="price-tag">12,50 €</p>
      <!-- FALLO 9: Texto de botón "Añadir" ambiguo para lectores de pantalla -->
      <!-- FALLO 10: Texto blanco sobre botón amarillo (#facc15), invalida WCAG AA -->
      <button class="btn-buy" onclick="alert('Añadido')">Añadir</button>
    </div>
  </div>

  <!-- FALLO 11: Modal flotante maquetado con <div>, sin roles ARIA ni trampa de foco -->
  <div class="modal-overlay" id="promoModal">
    <div class="modal-content">
      <!-- FALLO 12: Cierre de modal hecho con un <span> no interactivo y un carácter "X" sin contexto -->
      <span class="close-btn" onclick="document.getElementById('promoModal').style.display='none'">X</span>
      <h3>¡Consigue un 10% de descuento!</h3>
      <p>Suscríbete a nuestra lista de correo hoy mismo.</p>
    </div>
  </div>

  <div style="clear: both; padding: 20px;">
    <h3>Contacto</h3>
    <form id="contactForm">
      <!-- FALLO 13: Campo de texto sin <label> asociado -->
      <!-- FALLO 14: Marcado de campo obligatorio únicamente con placeholder o asterisco visual -->
      Nombre (*):<br>
      <input type="text" id="nombreCliente" placeholder="Tu nombre..."><br><br>

      <!-- FALLO 15: Mensaje de error no comunicado a lectores de pantalla (sin role="alert") -->
      <span id="nameErr" class="error-msg" style="display:none;">El campo nombre es obligatorio</span><br>

      <button type="button" onclick="validarFormulario()">Enviar</button>
    </form>
  </div>

  <!-- FALLO 16: Pie de página sin etiqueta <footer> -->
  <div style="background: #222; color: #fff; padding: 15px; text-align: center;">
    <p>Síguenos en redes:</p>
    <!-- FALLO 17: Enlaces que solo contienen un icono visual sin texto accesible -->
    <a href="#" class="social-icon">f</a>
    <a href="#" class="social-icon">t</a>
    <p>© 2026 EcoShop Verde</p>
  </div>

  <script>
    function validarFormulario() {
      var nom = document.getElementById('nombreCliente').value;
      if (!nom) {
        document.getElementById('nameErr').style.display = 'block';
      } else {
        document.getElementById('nameErr').style.display = 'none';
        alert('Enviado');
      }
    }
  </script>

</body>

</html>
